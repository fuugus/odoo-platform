<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Odoo Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>Odoo Platform</h2>
            <span class="version">v1.0</span>
        </div>
        <ul class="nav-links">
            <li><a href="/setup" class="{% if request.url.path == '/setup' %}active{% endif %}">
                <span class="icon icon-settings"></span> <span>Setup Wizard</span>
            </a></li>
            <li><a href="/dashboard" class="{% if request.url.path == '/dashboard' %}active{% endif %}">
                <span class="icon icon-chart"></span> <span>Dashboard</span>
            </a></li>
            <li><a href="/instances" class="{% if request.url.path == '/instances' %}active{% endif %}">
                <span class="icon icon-server"></span> <span>Instanzen</span>
            </a></li>
            <li><a href="/deploy" class="{% if request.url.path == '/deploy' %}active{% endif %}">
                <span class="icon icon-deploy"></span> <span>Deploy</span>
            </a></li>
            <li><a href="/databases" class="{% if request.url.path == '/databases' %}active{% endif %}">
                <span class="icon icon-database"></span> <span>Datenbanken</span>
            </a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/api/health" target="_blank">API Health</a>
        </div>
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ static_url('js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
